version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: admin123
      MYSQL_DATABASE: demand_system
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
      - ../database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-padmin123"]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8.6-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:management
    container_name: rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"    # AMQP 端口
      - "15672:15672"  # 管理控制台
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  minio:
    image: minio/minio:latest
    container_name: minio
    restart: unless-stopped
    ports:
      - "9000:9000"    # API 端口
      - "9001:9001"    # 控制台端口
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin123456
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mc alias set local http://minio:9000 admin admin123456;
        mc mb -p local/demand-system || true;
        exit 0

  elasticsearch:
    image: elasticsearch:8.17.0
    container_name: elasticsearch
    restart: unless-stopped
    ports:
      - "9200:9200"    # HTTP API
      - "9300:9300"    # 节点间通信
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: etcd
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd

  milvus:
    image: milvusdb/milvus:v2.4.4
    container_name: milvus
    restart: unless-stopped
    ports:
      - "19530:19530"  # gRPC
      - "9091:9091"    # Health/Metrics
    depends_on:
      - etcd
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: minioadmin
      MINIO_SECRET_ACCESS_KEY: minioadmin
    command: ["milvus", "run", "standalone"]
    volumes:
      - milvus_data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5

  kkfileview:
    image: kkfileview:5.0.1
    container_name: kkfileview
    restart: unless-stopped
    ports:
      - "8012:8012"
    environment:
      - TZ=Asia/Shanghai
      # 不覆盖 base.url（让 kkFileView 从请求 Host 头推断成 localhost:8012），
      # 浏览器侧返回的 PDF 链接必须用浏览器能解析的地址，
      # host.docker.internal 仅供容器内下载 MinIO 文件使用
      # 容器化后 MinIO 走容器名或 host.docker.internal，
      # 加上默认的 localhost/127.0.0.1 覆盖 kkFileView 的默认白名单
      - KK_TRUST_HOST=localhost,127.0.0.1,host.docker.internal,minio,kkfileview
      # 切到宿主机 redis 作为分布式缓存
      # （容器内通过 host.docker.internal 解析到宿主机 6379）
      - KK_CACHE_TYPE=redis
      - KK_SPRING_REDISSON_ADDRESS=redis://host.docker.internal:6379
      # 持久化 PDF 缓存目录到 named volume，避免容器重启后 PDF 文件丢失、
      # redis 中残留幽灵缓存导致 kkFileView 假装转码完成
      - KK_FILE_DIR=/opt/kkFileView-5.0.0/file
    extra_hosts:
      # 跨平台兼容：让容器内 host.docker.internal 解析为宿主机网关
      # Windows Docker Desktop 默认支持；Linux docker 需要这行
      - "host.docker.internal:host-gateway"
    volumes:
      - kkfileview_file:/opt/kkFileView-5.0.0/file
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8012/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:
  minio_data:
  es_data:
  etcd_data:
  milvus_data:
  kkfileview_file:
